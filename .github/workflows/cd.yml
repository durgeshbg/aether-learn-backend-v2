name: Build and Push to AWS ECR

on:
  push:
    branches: ['main']

jobs:
  build-push-ecr:
    name: Build and Push to AWS ECR
    runs-on: ubuntu-latest
    environment: production

    # OIDC authentication requires write permission for id-token
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v3'

      # Authenticate with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          role-session-name: GitHubActionsECRDeployment

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

