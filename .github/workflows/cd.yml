name: Build and Push to GCP Artifact Registry

on:
  push:
    branches: ['main']

jobs:
  build-push-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v3'

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.SERVICE_ACCOUNT_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build . --tag ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest

      - name: Push image
        run: docker push ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest

      - name: SSH to VM and pull image and restart service
        uses: 'google-github-actions/ssh-compute@v2'
        with:
          instance_name: '${{ secrets.INSTANCE_NAME }}'
          zone: '${{ secrets.REGION }}-${{ secrets.INSTANCE_ZONE }}'
          ssh_private_key: '${{ secrets.SSH_PRIVATE_KEY }}'
