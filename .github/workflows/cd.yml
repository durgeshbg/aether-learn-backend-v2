name: Build and Push to GCP Artifact Registry

on:
  push:
    branches: ['main']

jobs:
  build-push-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v3'

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.SERVICE_ACCOUNT_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build . --tag ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest

      - name: Push image
        run: docker push ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest

      - name: SSH to VM and pull image and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo '${{ secrets.ENV_FILE }}' > .env
            docker pull ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest
            sudo docker stop aether-learn-backend-v2
            sudo docker rm aether-learn-backend-v2
            sudo docker run --name aether-learn-backend-v2 -d -p 3000:3000 --env-file .env ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest
