name: Build and Push to GCP Artifact Registry

on:
  push:
    branches: ['main']

jobs:
  build-push-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v3'

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.SERVICE_ACCOUNT_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      # - name: 'Docker auth'
      #   run: |-
      #     gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev --quiet

      # - name: Build image
      #   run: docker build . --tag ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest

      # - name: Push image
      #   run: docker push ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts

      - name: Execute deployment script via SSH
        run: ssh -i ~/.ssh/id_ed25519 ${{ secrets.USERNAME }}@${{ secrets.HOST_IP }} bash <<EOF
          echo '${{ secrets.ENV_FILE }}' > .env
          sudo docker pull ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest
          sudo docker stop aether-learn-backend-v2
          sudo docker rm aether-learn-backend-v2
          sudo docker run --name aether-learn-backend-v2 -d -p 3000:3000 --env-file .env ${{ secrets.GAR_LOCATION }}/aether-learn-backend-v2:latest
          EOF
